# Tags for feature announcements. Deliberately small.
#
# Every post carries at least one audience tag and exactly one topic tag, two or
# three in total. There is no universal "announcement" tag — a tag applied to
# every post produces a page identical to the feed itself, which is what the old
# `changelog` tag was.
#
# The 24 release-note tags (performance, infrastructure, accessibility and so on)
# stayed with the archive in releases/tags.yml. Those describe engineering work;
# a feature announcement is never *about* accessibility, it is a property of it.

for-families:
  label: For families
  permalink: /for-families
  description: Announcements most relevant to families using Famlo

for-organizations:
  label: For organizations
  permalink: /for-organizations
  description: Announcements most relevant to people running an organization

communication:
  label: Communication
  permalink: /communication
  description: Messages, announcements, and notifications

activities:
  label: Activities
  permalink: /activities
  description: Scheduling, registration, attendance, and calendars

payments:
  label: Payments
  permalink: /payments
  description: Checkout, refunds, dues, and scholarships

community:
  label: Community
  permalink: /community
  description: Finding organizations, profiles, and members
